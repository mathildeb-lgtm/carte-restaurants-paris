<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Carte Restaurants – Mobile friendly</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    :root { --bg:#ffffff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --chip:#f3f4f6; }
    html, body { height:100%; margin:0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    #map { height:100%; width:100%; }

    .topbar{
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 9999;
      display:flex; gap:8px; align-items:center;
      background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    .topbar input{
      flex:1; min-width: 0;
      border:1px solid var(--border); border-radius: 12px; padding:10px 12px; font-size:14px;
    }
    .btn{
      border:1px solid var(--border); background:#fff; border-radius: 12px;
      padding:10px 12px; font-size:13px; cursor:pointer; white-space:nowrap;
    }

    .sheet{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9998;
      max-height: 72vh;
      transform: translateY(calc(100% - 56px));
      transition: transform .25s ease;
      background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      border-top-left-radius: 18px; border-top-right-radius: 18px;
      box-shadow: 0 -10px 24px rgba(0,0,0,.10);
      display:flex; flex-direction:column;
    }
    .sheet.open{ transform: translateY(0); }
    .sheet-handle{ height:56px; display:flex; align-items:center; justify-content:center; }
    .grab{ width: 44px; height: 5px; border-radius: 999px; background: #d1d5db; }

    .chips{
      display:flex; gap:6px; flex-wrap:wrap; padding: 0 14px 10px;
      overflow:auto;
    }
    .chip{
      border:1px solid var(--border); background: var(--chip);
      border-radius: 999px; padding: 6px 10px; font-size:12px; cursor:pointer; user-select:none;
    }
    .chip.active{ background:#111827; color:#fff; border-color:#111827; }

    .list{ padding: 0 14px 14px; overflow:auto; }
    .item{
      border:1px solid var(--border); border-radius: 14px; padding: 10px; margin-bottom: 10px;
      background:#fff;
    }
    .item b{ display:block; font-size:13px; margin-bottom: 4px; }
    .meta{ font-size:12px; color:var(--muted); margin-bottom: 4px; }
    .addr{ font-size:12px; margin-bottom: 6px; }
    .item a{ font-size:12px; color:#1f2937; word-break: break-all; }

    @media (min-width: 1000px){
      .topbar{ left: 16px; right: auto; width: 520px; }
      .sheet{ left: 16px; right: auto; width: 520px; border:1px solid var(--border);
              border-radius: 18px; bottom: 16px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <input id="search" type="search" placeholder="Rechercher un restaurant…" />
    <button class="btn" id="fit">Zoom</button>
    <button class="btn" id="toggleList">Liste</button>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle" id="sheetHandle"><div class="grab"></div></div>
    <div style="display:flex; align-items:baseline; gap:8px; padding: 0 14px 10px;">
      <div style="font-weight:800; font-size:14px;" id="sheetTitle">Restaurants</div>
      <div style="font-size:12px; color:var(--muted);" id="sheetSub">Tap sur une ligne → zoom + popup</div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </div>

const map = L.map('map', { zoomControl:true }).setView([48.8566,2.3522], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const cluster = L.markerClusterGroup({ chunkedLoading:true });
map.addLayer(cluster);

const ALL_ZONES = [...Array(20)].map((_,i)=>`Paris ${i+1}`).concat(["Banlieue"]);
let activeZone = "Tous";
let searchTerm = "";

function el(id){ return document.getElementById(id); }
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function zoneOf(p){ return (p.zone || "Banlieue"); }

function filtered(){
  return PLACES.filter(p=>{
    const z = zoneOf(p);
    const okZone = (activeZone==="Tous") || (z===activeZone);
    const okSearch = !searchTerm || norm(p.name).includes(norm(searchTerm)) || norm(p.group).includes(norm(searchTerm)) || norm(p.people).includes(norm(searchTerm));
    return okZone && okSearch;
  });
}

function renderChips(){
  const chips=el('chips'); chips.innerHTML='';
  const counts = {};
  PLACES.forEach(p=>{ const z=zoneOf(p); counts[z]=(counts[z]||0)+1; });
  const labels = ["Tous", ...ALL_ZONES];
  labels.forEach(z=>{
    const c=document.createElement('div');
    c.className='chip'+(z===activeZone?' active':'');
    const n = z==="Tous" ? PLACES.length : (counts[z]||0);
    c.textContent = `${z} (${n})`;
    c.onclick=()=>{ activeZone=z; renderChips(); refresh(); openSheet(); };
    chips.appendChild(c);
  });
}

function renderList(items){
  const list=el('list'); list.innerHTML='';
  items.forEach(p=>{
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML = `
      <b>${p.n}. ${p.name}</b>
      <div class="meta">${p.group}${p.people ? " • "+p.people : ""}${p.handle ? " • "+p.handle : ""}</div>
      <div class="addr">${p.address || ""}</div>
      <a href="${p.url}" target="_blank" rel="noopener noreferrer">Ouvrir Instagram</a>
    `;
    div.onclick=()=>{
      if(p.__marker){
        map.setView(p.__marker.getLatLng(), Math.max(map.getZoom(), 15));
        p.__marker.openPopup();
      }
    };
    list.appendChild(div);
  });
}

function refresh(){
  const items = filtered();
  el('sheetTitle').textContent = `Restaurants (${items.length} / ${PLACES.length})`;

  cluster.clearLayers();
  items.forEach(p=>{
    if(!p.lat || !p.lon) return;
    const m = L.marker([p.lat, p.lon]);
    p.__marker = m;

    const safeAddr=(p.address||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const safePeople=(p.people||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const popup = `
      <div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; max-width:260px;">
        <b>${p.n}. ${p.name}</b><br/>
        <span style="opacity:.75">${p.group}${safePeople ? " • "+safePeople : ""}${p.handle ? " • "+p.handle : ""}</span>
        ${safeAddr ? `<div style="margin-top:6px; font-size:12px;">${safeAddr}</div>` : ""}
        <div style="margin-top:8px;">
          <a href="${p.url}" target="_blank" rel="noopener noreferrer">Ouvrir Instagram</a>
        </div>
      </div>`;
    m.bindPopup(popup);
    cluster.addLayer(m);
  });

  renderList(items);

  const b=[];
  cluster.eachLayer(m=>{ if(m.getLatLng){ const ll=m.getLatLng(); b.push([ll.lat,ll.lng]); }});
  if(b.length) map.fitBounds(b, { padding:[30,30] });
}

el('search').addEventListener('input', e=>{ searchTerm = e.target.value || ''; refresh(); openSheet(); });
el('fit').onclick=()=>{
  const b=[];
  cluster.eachLayer(m=>{ if(m.getLatLng){ const ll=m.getLatLng(); b.push([ll.lat,ll.lng]); }});
  if(b.length) map.fitBounds(b, { padding:[30,30] });
};

const sheet = el('sheet');
function openSheet(){ sheet.classList.add('open'); }
function toggleSheet(){ sheet.classList.toggle('open'); }
el('toggleList').onclick = toggleSheet;
el('sheetHandle').onclick = toggleSheet;

renderChips();
refresh();
</script>
